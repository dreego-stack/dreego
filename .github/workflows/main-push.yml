name: main-push

on:
  push:
    branches: [main]

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install Wails Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev strace xvfb x11-utils

      - name: Install pinned native TypeScript compiler
        run: go run ./cmd/dreego tools install typescript

      - name: Test and release latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            git fetch origin main --tags
            git checkout -B release-work origin/main

            python3 _scripts/release-prep.py --verify-tags

            latest=$(git for-each-ref --format='%(refname:short)' --sort=-version:refname 'refs/tags/v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
              echo "error: latest published tag $latest is not an ancestor of main" >&2
              echo "restore the published release history through a pull request; never move or recreate the tag" >&2
              exit 1
            fi

            task test

            if ! find .changes -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
              echo "no pending change files"
              exit 0
            fi

            if grep -Eq '^version: major$' .changes/*.md; then
              echo "error: version major is forbidden until the v1 release" >&2
              exit 1
            fi

            python3 _scripts/release-prep.py | tee /tmp/release-prep.out
            new=$(grep '^new=' /tmp/release-prep.out | cut -d= -f2)

            if [ "$new" = none ]; then
              echo "only none-pending change files; keeping them pending"
              exit 0
            fi

            tags=$(grep '^tags=' /tmp/release-prep.out | cut -d= -f2-)
            if [ -z "$tags" ]; then
              echo "error: release preparation did not provide coordinated tags" >&2
              exit 1
            fi

            for tag in $tags; do
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "error: release tag already exists: $tag" >&2
                exit 1
              else
                status=$?
                if [ "$status" -ne 2 ]; then
                  echo "error: could not verify remote release tag: $tag" >&2
                  exit "$status"
                fi
              fi
            done

            task test

            git add -A
            git commit -m "docs: apply pending release notes"

            for tag in $tags; do
              git tag "$tag"
            done

            if git push --atomic origin HEAD:main $tags; then
              exit 0
            fi

            git tag -d $tags

            echo "main advanced during release attempt $attempt; retrying latest main"
          done

          echo "release failed after five concurrent-update retries" >&2
          exit 1
