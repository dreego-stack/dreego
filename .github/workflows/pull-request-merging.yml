name: pull-request-merging

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  process:
    # Only run on pushes to main. Both a merged PR (push event) and a closed
    # PR (pull_request closed) trigger this workflow; running process on both
    # causes a race where two runs amend the same merge commit and one fails
    # with "stale info". The push event is the single source of truth.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if no pr.md (loop protection)
        id: check
        run: |
          if [ -f pr.md ]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            echo "no pr.md, nothing to process"
          fi

      - name: Apply pr.md (changelog + version + remove pr.md)
        id: prep
        if: steps.check.outputs.has_pr == 'true'
        run: |
          python3 _scripts/release-prep.py | tee /tmp/prep.out
          echo "new_version=$(grep '^new=' /tmp/prep.out | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit and push to main
        if: steps.check.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin main

      - name: Create tag if version bumped
        if: steps.check.outputs.has_pr == 'true' && steps.prep.outputs.new_version != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="${{ steps.prep.outputs.new_version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$new$"; then
            echo "tag $new already exists, skipping"
            exit 0
          fi
          git tag "$new"
          git push origin "$new"
          echo "created tag $new"

  delete-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          if [ "$branch" = "main" ]; then
            echo "refusing to delete main"
            exit 0
          fi
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/$branch" \
            || echo "branch $branch already deleted or not found"
          echo "deleted branch $branch"