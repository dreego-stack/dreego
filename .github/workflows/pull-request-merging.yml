name: pull-request-merging

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if no pr.md (loop protection)
        id: check
        run: |
          if [ -f pr.md ]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            echo "no pr.md, nothing to process"
          fi

      - name: Apply pr.md (changelog + version + remove pr.md)
        if: steps.check.outputs.has_pr == 'true'
        run: python3 _scripts/release-prep.py

      - name: Commit and push to main
        if: steps.check.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin main

      - name: Create tag if version bumped
        if: steps.check.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(cat VERSION)
          last_tag=$(git ls-remote --tags origin | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$last_tag" ] || [ "$last_tag" = "$current" ]; then
            echo "no version bump (last=$last_tag current=$current), skipping tag"
            exit 0
          fi
          git tag "$current"
          git push origin "$current"
          echo "created tag $current"

  delete-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          if [ "$branch" = "main" ]; then
            echo "refusing to delete main"
            exit 0
          fi
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/$branch" \
            || echo "branch $branch already deleted or not found"
          echo "deleted branch $branch"