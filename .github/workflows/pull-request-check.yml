name: pull-request-check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (fork PRs only)'
        required: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify published release ancestry
        run: |
          python3 _scripts/release-prep.py --verify-tags
          latest=$(git for-each-ref --format='%(refname:short)' --sort=-version:refname 'refs/tags/v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "error: latest published tag $latest is not an ancestor of this change" >&2
            echo "merge the published release history; never move or recreate the tag" >&2
            exit 1
          fi

      - name: Validate change file
        run: |
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          files=$(git diff --diff-filter=A --name-only "$base" HEAD -- '.changes/*.md' | grep -v '^.changes/README.md$' || true)
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "error: expected exactly one new .changes/*.md file, found $count"
            exit 1
          fi

          HEAD_REF="${{ github.event.pull_request.head.ref }}" python3 - <<'EOF'
          import os, pathlib, re, subprocess, sys
          base = subprocess.check_output(['git', 'merge-base', 'HEAD', 'origin/main'], text=True).strip()
          names = subprocess.check_output(['git', 'diff', '--diff-filter=A', '--name-only', base, 'HEAD', '--', '.changes/*.md'], text=True).splitlines()
          files = [pathlib.Path(name) for name in names if name != '.changes/README.md']
          path = files[0]
          text = path.read_text()
          match = re.match(r'^---\s*\n(.*?)\n---\s*\n?(.*)$', text, re.DOTALL)
          if not match:
              print(f'error: {path} must start with YAML frontmatter')
              sys.exit(1)
          version = next((line.split(':', 1)[1].strip() for line in match.group(1).splitlines() if line.strip().startswith('version:')), None)
          head_ref = os.environ.get('HEAD_REF', '')
          if version not in ('none', 'patch', 'minor'):
              print(f'error: version must be none, patch or minor, got {version!r}')
              sys.exit(1)
          if version == 'minor' and not head_ref.startswith('stage/'):
              print(f'error: version minor is only allowed for stage/* branch PRs, head ref is {head_ref!r}')
              sys.exit(1)
          lines = [line for line in match.group(2).splitlines() if line.strip()]
          if not lines:
              print(f'error: {path} has no changelog lines')
              sys.exit(1)
          print(f'ok: {path} version={version} lines={len(lines)}')
          EOF

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install Wails Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev strace xvfb x11-utils

      - name: Install pinned native TypeScript compiler
        run: go run ./cmd/dreego tools install typescript

      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./internal/... ./core/... ./adapter/ssr/... ./adapter/wails/... ./dreegotest/... ./cmd/dreego/... ./_tests/go/...

      - name: fuzz MarkdownToHTML safe
        run: |
          timeout 120s go test ./core/ -run FuzzMarkdownToHTMLSafe -fuzz=FuzzMarkdownToHTMLSafe -fuzztime=30s

      - name: coverage gate
        run: task coverage

      - name: task test
        run: task test
