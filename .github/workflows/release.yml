name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: make test
        run: make test

      - name: Resolve version from CHANGELOG
        id: version
        run: |
          top=$(grep -m1 '^## v[0-9]' CHANGELOG.md | sed 's/^## //; s/ - .*//')
          echo "version=$top" >> "$GITHUB_OUTPUT"
          echo "resolved version: $top"

      - name: Create tag
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$new$"; then
            echo "tag $new already exists, skipping"
            exit 0
          fi
          git tag "$new"
          git push origin "$new"
          echo "created tag $new"
