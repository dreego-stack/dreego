<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg2)"/>
  <!-- ears -->
  <ellipse cx="34" cy="44" rx="18" ry="22" fill="#78716c"/>
  <ellipse cx="34" cy="46" rx="12" ry="16" fill="#fbbf24"/>
  <ellipse cx="94" cy="44" rx="18" ry="22" fill="#78716c"/>
  <ellipse cx="94" cy="46" rx="12" ry="16" fill="#fbbf24"/>
  <!-- head -->
  <ellipse cx="64" cy="72" rx="44" ry="36" fill="#a8a29e"/>
  <ellipse cx="64" cy="74" rx="40" ry="32" fill="#d6d3d1"/>
  <!-- cheeks -->
  <ellipse cx="38" cy="82" rx="18" ry="14" fill="#f5f5f4"/>
  <ellipse cx="90" cy="82" rx="18" ry="14" fill="#f5f5f4"/>
  <!-- mask -->
  <ellipse cx="40" cy="66" rx="16" ry="10" fill="#292524" transform="rotate(-8 40 66)"/>
  <ellipse cx="88" cy="66" rx="16" ry="10" fill="#292524" transform="rotate(8 88 66)"/>
  <ellipse cx="64" cy="74" rx="18" ry="8" fill="#292524"/>
  <!-- eyes -->
  <ellipse cx="42" cy="66" rx="9" ry="11" fill="white"/>
  <ellipse cx="86" cy="66" rx="9" ry="11" fill="white"/>
  <circle cx="43" cy="65" r="5" fill="#1c1917"/>
  <circle cx="87" cy="65" r="5" fill="#1c1917"/>
  <circle cx="45" cy="63" r="2.5" fill="white"/>
  <circle cx="89" cy="63" r="2.5" fill="white"/>
  <!-- nose -->
  <ellipse cx="64" cy="80" rx="6" ry="4" fill="#292524"/>
  <ellipse cx="62" cy="79" rx="2" ry="1.5" fill="#57534e" opacity="0.5"/>
  <!-- mouth -->
  <path d="M60 84 Q64 90 68 84" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
</svg>
