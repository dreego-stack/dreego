version: '3'

vars:
  ROOT_VERSION:
    sh: git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  up:
    cmds:
      - cd demo/demo-ssr && docker compose up -d

  down:
    cmds:
      - cd demo/demo-ssr && docker compose down

  build:
    cmds:
      - go build -ldflags "-X main.version={{.ROOT_VERSION}}" -o tmp/dreego ./cmd/dreego

  generate:
    cmds:
      - go run ./cmd/dreego

  dev:
    cmds:
      - go run ./cmd/dreego && go run .

  coverage:
    cmds:
      - sh _scripts/coverage-gate.sh

  test:
    cmds:
      - |
        run_tests() {
          go run ./cmd/dreego tools install typescript
          sh _scripts/check-wails-demo.sh
          CGO_ENABLED=1 go test -race ./internal/... ./core/... ./adapter/ssr/... ./adapter/wails/... ./dreegotest/... ./cmd/dreego/... ./_tests/go/...
          task coverage
          if [ ! -f /.dockerenv ] && [ "${DREEGO_IN_SMD:-}" != "1" ]; then
            docker build -q --build-arg DREEGO_VERSION="{{.ROOT_VERSION}}" -f _tests/Dockerfile -t dreego-test . > /dev/null 2>&1
            docker run --rm -e DREEGO_FILTER="${DREEGO_FILTER:-}" -e DREEGO_RUNS="${DREEGO_RUNS:-1}" -e DREEGO_VERSION="{{.ROOT_VERSION}}" dreego-test
          else
            echo "Skipping Docker black-box tests inside smd"
          fi
        }
        if [ -f /.dockerenv ] || [ "${DREEGO_IN_SMD:-}" = "1" ] || [ "${CI:-}" = "true" ]; then
          run_tests
        else
          DREEGO_IN_SMD=1 smd task test
        fi

  install-hooks:
    cmds:
      - cp _scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - cp _scripts/pre-push .git/hooks/pre-push
      - chmod +x .git/hooks/pre-push
      - echo "Git hooks installed"

  clean:
    cmds:
      - rm -f *_dreego.go
      - rm -rf tmp/
