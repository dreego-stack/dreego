version: '3'

vars:
  ROOT_VERSION:
    sh: git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  up:
    cmds:
      - cd demo/demo-ssr && docker compose up -d

  down:
    cmds:
      - cd demo/demo-ssr && docker compose down

  build:
    cmds:
      - go build -ldflags "-X main.version={{.ROOT_VERSION}}" -o tmp/dreego ./cmd/dreego

  generate:
    cmds:
      - go run ./cmd/dreego

  dev:
    cmds:
      - go run ./cmd/dreego && go run .

  coverage:
    cmds:
      - sh _tests/e2e/invariants/coverage/test.sh

  test:
    cmds:
      - |
        run_tests() {
          CGO_ENABLED=1 go test -race ./internal/... ./core/... ./adapter/ssr/... ./adapter/wails/... ./dreegotest/... ./cmd/dreego/...
          DREEGO_VERSION="{{.ROOT_VERSION}}" sh _tests/test.sh
        }
        if [ -f /.dockerenv ] || [ "${DREEGO_IN_SMD:-}" = "1" ] || [ "${CI:-}" = "true" ]; then
          run_tests
        else
          DREEGO_IN_SMD=1 smd task test
        fi

  clean:
    cmds:
      - rm -f *_dreego.go
      - rm -rf tmp/
