[project]
  name = "dreego"

[container]
  workdir = "/app"

[security]
  allow_env = []

[volume]
  enabled = false
  [volume.packages]

[port]

[session]
  ports = []

[live]
  mount_pwd = true
  ports = ["8080:8080"]

[temp]
  allow_env = []
  mount_pwd = true
  read_only = false

[dockerfile]
  lines = ["FROM docker.io/golang:1.27-alpine", "RUN apk add --no-cache curl gcc git gtk4.0-dev make musl-dev pkgconf python3 strace webkit2gtk-6.0-dev xvfb xwininfo"]
